[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sip_tpv"
version = "2.0"
description = "Conversion of distortion representations in FITS headers between SIP and TPV formats."
readme = { file = "README", content-type = "text/x-rst" }
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "David Shupe", email = "shupe@ipac.caltech.edu" },
    { name = "Austin Beauchamp", email = "austinbeauch@gmail.com" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
# Minimums are the oldest versions tested: the tests pass on Python 3.11
# with exactly these versions.
dependencies = [
    "numpy>=1.23.2",
    "astropy>=5.2",
    "sympy>=1.11",
    "click>=8.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/stargaser/sip_tpv"
Issues = "https://github.com/stargaser/sip_tpv/issues"

[project.scripts]
pv_to_sip = "sip_tpv.pv_to_sip:cli"
sip_to_pv = "sip_tpv.sip_to_pv:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
]
